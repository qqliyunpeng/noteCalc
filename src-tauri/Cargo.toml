[package]
name = "notecalc"
version = "0.2.0"
description = "noteCalc"
edition = "2021"
rust-version = "1.82"

[lib]
name = "notecalc_lib"
# Desktop-only: `cdylib` (needed for Android) makes the windows-gnu linker emit a
# DLL whose export ordinals overflow ("export ordinal too large"), so it is
# intentionally omitted.
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# For the parts of the desktop a webview cannot read on its own: the caption
# accent (`theme`) and the window chrome metrics (`metrics`).
windows-sys = { version = "0.61", features = [
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
